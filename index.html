<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>QuickNotes</h1>

    <!-- Load Notes Section -->
    <section class="card">
      <button id="load-btn">Load Notes</button>
      <p id="status"></p>
    </section>

    <!-- Create Note Form -->
    <section class="card">
      <h2>Create Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (Required, max 100 characters):</label>
          <input type="text" id="title-input" maxlength="100" required placeholder="Enter note title">
        </div>

        <div class="form-group">
          <label for="body-input">Body (Optional):</label>
          <textarea id="body-input" rows="4" placeholder="Enter note content"></textarea>
        </div>

        <button type="submit" id="submit-btn">Submit Note</button>
      </form>
    </section>

    <!-- Notes List Section -->
    <section class="card">
      <h2>Your Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
